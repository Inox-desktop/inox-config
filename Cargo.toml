[package]
name = "inox-config"
description = "Configuration model and TOML parsing for the Inox desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/Inox-desktop/inox-config"
readme = "README.md"
keywords = ["wayland", "desktop", "inox"]
categories = ["desktop"]

[dependencies]
# inox-common is pinned to a release tag (root AGENTS.md §8). The explicit
# `version` is required because `deny.toml` sets `[bans] wildcards = "deny"`;
# without it the git dependency would carry an implicit `*` requirement.
inox-common = { git = "https://github.com/Inox-desktop/inox-common", tag = "v0.2.0", version = "0.2" }
serde = { version = "1", features = ["derive"] }
# Field paths in parse errors (`input.keyboard_repeat_rate_hz`) come from here;
# `toml` alone only reports the position.
serde_path_to_error = "0.1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
# Loading and reloading are only meaningful against real files.
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
